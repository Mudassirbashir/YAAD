    <script>
      // Ensure window.fetch has both getter and setter for sandboxed iframe environments
      (function() {
        try {
          var originalFetch = window.fetch ? window.fetch.bind(window) : undefined;
          var _currentFetch = originalFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return _currentFetch;
            },
            set: function(fn) {
              _currentFetch = fn;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          // fallback ignore
        }
      })();
    </script>
